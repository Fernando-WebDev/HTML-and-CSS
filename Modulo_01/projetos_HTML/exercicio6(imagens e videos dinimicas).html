<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens e videos</title>
</head>
<body>
    <h1>Imagens dinamicas</h1>
    <p>Abaixo está um adaptador de imagens usando as tags PICTURE e SOURCE: </p>
    <picture>
        <source media="(min-width: 750px)" srcset="/Modulo_01/projetos_HTML/media/ze-gotinha_p" type="image/jpg">
        <source media="(min-width: 1050px)" srcset="/Modulo_01/projetos_HTML/media/ze-gotinha_m" type="image/jpg">
        <img src="/Modulo_01/projetos_HTML/media/ze-gotinha_g.jpg" alt="img grande">
    </picture>
    <hr>
    <h1>Adicionando aúdio</h1>
    <audio src="/Modulo_01/projetos_HTML/media/Tame Impala - New Person, Same Old Mistakes (Audio) - tameimpalaVEVO (youtube).mp3" controls loop></audio> <!--Tipos de aúdio = MP3, OGG, WAV-->
    <hr>
    <h1>Adicionando Vídeos</h1>
    <h2>videos internos</h2>
    <video src="/Modulo_01/projetos_HTML/media/video.mp4" width="560" controls></video>
    <h2>Videos externos</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/qU9mHegkTc4?si=QFm4XPyRo0w7Y8JQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
